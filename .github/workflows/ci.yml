name: CI

# Identical in every extension repo except NODE_VERSION (and any extra suite a repo documents).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# The Node floor from package.json engines, so CI catches use of newer-only features.
env:
  NODE_VERSION: "22.13.0"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Tests, lint and format check
        run: npm test

      - name: Audit shipped dependencies
        run: npm audit --omit=dev

      - name: Package extension
        run: npm run package

      - name: Confirm exactly one .vsix was created
        run: |
          shopt -s nullglob
          FILES=(*.vsix)
          if [[ ${#FILES[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one .vsix, found ${#FILES[@]}."
            exit 1
          fi
          echo "Package created: ${FILES[0]}"
