name: CI

# This file is shared with the other extensions published as KunalPathak and must stay identical
# in all of them. Read docs/sibling-extensions.md before you change it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # .nvmrc holds the lowest Node that package.json engines allows, so CI catches use of newer-only features.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check .nvmrc matches engines.node
        run: |
          FLOOR=$(node -p "require('./package.json').engines.node.replace('>=', '')")
          if [[ "$(tr -d '[:space:]' < .nvmrc)" != "$FLOOR" ]]; then
            echo "::error::.nvmrc does not match engines.node in package.json."
            exit 1
          fi

      - run: npm ci

      - name: Tests, lint and format check
        run: npm test

      - name: Audit shipped dependencies
        run: npm audit --omit=dev

      - name: Package extension
        run: npm run package

      - name: Confirm exactly one .vsix was created
        run: |
          shopt -s nullglob
          FILES=(*.vsix)
          if [[ ${#FILES[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one .vsix, found ${#FILES[@]}."
            exit 1
          fi
          echo "Package created: ${FILES[0]}"
