<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data: vscode-resource:; script-src 'nonce-{{NONCE}}' https://cdn.jsdelivr.net; style-src 'unsafe-inline' https://cdn.jsdelivr.net; font-src https: data:;">
	<title>Markdown Preview</title>
	<link rel="stylesheet" href="{{HLJS_THEME}}">
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
			line-height: 1.6;
			margin: 0;
			padding: 0;
			background: var(--vscode-editor-background);
			color: var(--vscode-editor-foreground);
		}

		a {
			color: var(--vscode-textLink-foreground);
		}

		a:hover {
			color: var(--vscode-textLink-activeForeground, var(--vscode-textLink-foreground));
		}

		/* Hamburger toggle button */
		.sidebar-toggle {
			position: fixed;
			top: 10px;
			right: 10px;
			z-index: 1001;
			background: transparent;
			color: var(--vscode-editor-foreground);
			border: 1px solid var(--vscode-widget-border, var(--vscode-panel-border));
			padding: 12px 16px;
			cursor: pointer;
			border-radius: 4px;
			font-size: 1.5em;
			font-weight: normal;
			transition: background 0.2s ease, border-color 0.2s ease;
			line-height: 1;
		}

		.sidebar-toggle:hover {
			background: var(--vscode-toolbar-hoverBackground);
		}

		.sidebar-toggle:active {
			background: var(--vscode-toolbar-activeBackground, var(--vscode-toolbar-hoverBackground));
		}

		/* Overlay backdrop */
		.sidebar-overlay {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: rgba(0, 0, 0, 0.5);
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.3s ease;
			z-index: 1000;
		}

		body.sidebar-open .sidebar-overlay {
			opacity: 1;
			pointer-events: auto;
		}

		/* TOC Sidebar - Overlay pattern */
		.toc-sidebar {
			position: fixed;
			right: 0;
			top: 0;
			height: 100vh;
			width: 280px;
			background: var(--vscode-sideBar-background);
			border-left: 1px solid var(--vscode-sideBar-border, var(--vscode-panel-border));
			overflow-y: auto;
			padding: 20px;
			font-size: 0.9em;
			z-index: 1001;
			transform: translateX(100%);
			transition: transform 0.3s ease;
		}

		body.sidebar-open .toc-sidebar {
			transform: translateX(0);
		}

		/* Close button in sidebar header */
		.toc-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			font-size: 0.85em;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 0.5px;
			color: var(--vscode-descriptionForeground);
			margin-bottom: 12px;
			padding-bottom: 8px;
			border-bottom: 1px solid var(--vscode-sideBar-border, var(--vscode-panel-border));
		}

		.toc-close {
			background: none;
			border: none;
			font-size: 1.5em;
			color: var(--vscode-descriptionForeground);
			cursor: pointer;
			padding: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			width: 28px;
			height: 28px;
			border-radius: 3px;
			transition: background 0.2s ease;
		}

		.toc-close:hover {
			background: var(--vscode-toolbar-hoverBackground);
			color: var(--vscode-textLink-foreground);
		}

		.toc-list {
			list-style: none;
			margin: 0;
			padding: 0;
		}

		.toc-list ul {
			list-style: none;
			margin: 0;
			padding-left: 12px;
			margin-top: 2px;
		}

		.toc-item {
			margin: 2px 0;
		}

		/* Heading hierarchy prefix (pound signs) */
		.toc-prefix {
			margin-right: 6px;
			user-select: none;
			flex-shrink: 0;
		}

		/* Collapsible details/summary styling */
		.toc-details {
			border: none;
			margin: 0;
		}

		.toc-summary {
			list-style: none;
			cursor: pointer;
			display: flex;
			align-items: center;
		}

		.toc-summary::-webkit-details-marker {
			display: none;
		}

		/* Custom disclosure triangle */
		.toc-summary::before {
			content: '\25B6';
			font-size: 0.6em;
			color: var(--vscode-descriptionForeground);
			margin-right: 4px;
			transition: transform 0.15s ease;
			flex-shrink: 0;
			width: 12px;
			text-align: center;
		}

		.toc-details[open] > .toc-summary::before {
			transform: rotate(90deg);
		}

		/* Leaf items align with summary items (offset past triangle: 12px + 4px margin) */
		.toc-leaf > .toc-link {
			padding-left: 26px;
		}

		/* TOC link styling */
		.toc-link {
			display: flex;
			align-items: center;
			padding: 6px 10px;
			text-decoration: none;
			color: var(--vscode-textLink-foreground);
			border-radius: 3px;
			border-left: 3px solid transparent;
			transition: all 0.15s ease;
			flex: 1;
		}

		.toc-link:hover {
			background: var(--vscode-list-hoverBackground);
			color: var(--vscode-textLink-activeForeground, var(--vscode-textLink-foreground));
		}

		.toc-link.active {
			border-left-color: var(--vscode-textLink-foreground);
			background: var(--vscode-list-hoverBackground);
			color: var(--vscode-textLink-activeForeground, var(--vscode-textLink-foreground));
			font-weight: 500;
		}

		/* Content area - no margin offset needed (sidebar is overlay) */
		.content {
			flex: 1;
			padding: 20px;
			max-width: 900px;
			margin: 0 auto;
		}

		pre {
			background-color: var(--vscode-textCodeBlock-background);
			border: 1px solid var(--vscode-widget-border, var(--vscode-panel-border));
			border-radius: 4px;
			padding: 12px;
			overflow-x: auto;
		}

		code {
			background-color: var(--vscode-textCodeBlock-background);
			padding: 2px 4px;
			border-radius: 3px;
			font-family: 'Courier New', Courier, monospace;
			font-size: 0.9em;
		}

		pre code {
			background-color: transparent;
			padding: 0;
			font-family: 'Courier New', Courier, monospace;
		}

		blockquote {
			border-left: 4px solid var(--vscode-textBlockQuote-border);
			margin: 0;
			padding-left: 16px;
			color: var(--vscode-descriptionForeground);
		}

		table {
			border-collapse: collapse;
			width: 100%;
			margin: 16px 0;
		}

		th, td {
			border: 1px solid var(--vscode-widget-border, var(--vscode-panel-border));
			padding: 8px;
			text-align: left;
		}

		th {
			background-color: var(--vscode-editorWidget-background);
		}

		img {
			max-width: 100%;
			height: auto;
		}

		hr {
			border: none;
			border-top: 1px solid var(--vscode-widget-border, var(--vscode-panel-border));
		}

		.mermaid {
			background-color: transparent;
			border: none;
			text-align: center;
		}

		h1, h2, h3, h4, h5, h6 {
			scroll-margin-top: 20px;
		}

		/* Mobile responsiveness */
		@media (max-width: 768px) {
			.content {
				padding: 15px;
			}

			.sidebar-toggle {
				top: 8px;
				right: 8px;
				padding: 10px 14px;
				font-size: 1.3em;
			}
		}
	</style>
</head>
<body>
	<button class="sidebar-toggle" aria-label="Toggle outline sidebar" title="Show outline (ESC to close)">☰</button>
	<div class="sidebar-overlay" aria-hidden="true"></div>
	<aside class="toc-sidebar" role="navigation" aria-label="Document outline">
		<div class="toc-header">
			<span>Contents</span>
			<button class="toc-close" aria-label="Close sidebar">✕</button>
		</div>
		{{TOC}}
	</aside>
	<main class="content">
		{{CONTENT}}
	</main>
	<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" nonce="{{NONCE}}"></script>
	<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js" nonce="{{NONCE}}"></script>
	<script type="module" nonce="{{NONCE}}">
		import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

		// Initialize highlight.js for syntax highlighting
		try {
			document.querySelectorAll('pre code').forEach((block) => {
				hljs.highlightElement(block);
			});
		} catch (error) {
			console.error('Syntax highlighting failed:', error);
		}

		// Initialize Mermaid with theme matching VS Code
		mermaid.initialize({
			startOnLoad: false,
			theme: '{{MERMAID_THEME}}',
			securityLevel: 'loose'
		});

		// Run Mermaid on all diagram elements
		try {
			await mermaid.run({
				querySelector: '.mermaid'
			});
		} catch (error) {
			console.error('Mermaid rendering failed:', error);
		}

		// Trigger MathJax processing if loaded
		if (window.MathJax) {
			try {
				window.MathJax.typesetPromise().catch(err => console.error('MathJax rendering failed:', err));
			} catch (error) {
				console.error('MathJax initialization failed:', error);
			}
		}

		// Sidebar toggle functionality
		const toggleBtn = document.querySelector('.sidebar-toggle');
		const closeBtn = document.querySelector('.toc-close');
		const overlay = document.querySelector('.sidebar-overlay');
		const tocLinks = document.querySelectorAll('.toc-link');
		const headings = document.querySelectorAll('h1, h2, h3, h4, h5, h6');

		// Flag to prevent observer updates immediately after user clicks a link
		let isUserClicking = false;

		// Open sidebar when toggle button clicked
		toggleBtn.addEventListener('click', () => {
			document.body.classList.add('sidebar-open');
		});

		// Close sidebar when close button clicked
		closeBtn.addEventListener('click', () => {
			document.body.classList.remove('sidebar-open');
		});

		// Close sidebar when overlay clicked
		overlay.addEventListener('click', () => {
			document.body.classList.remove('sidebar-open');
		});

		// Close sidebar on Escape key
		document.addEventListener('keydown', (e) => {
			if (e.key === 'Escape') {
				document.body.classList.remove('sidebar-open');
			}
		});

		// Handle TOC link clicks for smooth scrolling
		tocLinks.forEach(link => {
			link.addEventListener('click', (e) => {
				e.preventDefault();
				e.stopPropagation(); // Prevent <details> toggle when clicking the link
				const id = link.getAttribute('href').substring(1);
				const target = document.getElementById(id);
				if (target) {
					// Set flag to prevent observer from updating active state during scroll
					isUserClicking = true;
					setTimeout(() => { isUserClicking = false; }, 800);

					target.scrollIntoView({ behavior: 'smooth' });
					updateActiveTOC(id);
				}
			});
		});

		// Update active TOC link based on scroll position and scroll TOC to show it
		function updateActiveTOC(activeId) {
			const sidebar = document.querySelector('.toc-sidebar');
			tocLinks.forEach(link => {
				link.classList.remove('active');
				if (link.getAttribute('href') === '#' + activeId) {
					link.classList.add('active');
					// Only auto-expand and auto-scroll when sidebar is visible
					if (document.body.classList.contains('sidebar-open')) {
						// Auto-expand collapsed ancestor sections to reveal active link
						let parent = link.closest('details');
						while (parent) {
							if (!parent.open) {
								parent.open = true;
							}
							parent = parent.parentElement ? parent.parentElement.closest('details') : null;
						}
						// Scroll the TOC sidebar to make the active link visible
						const activeLink = link;
						const linkTop = activeLink.offsetTop;
						const linkBottom = linkTop + activeLink.offsetHeight;
						const sidebarScrollTop = sidebar.scrollTop;
						const sidebarHeight = sidebar.clientHeight;
						const sidebarBottom = sidebarScrollTop + sidebarHeight;

						// If link is above visible area, scroll up
						if (linkTop < sidebarScrollTop) {
							sidebar.scrollTop = linkTop - 50;
						}
						// If link is below visible area, scroll down
						else if (linkBottom > sidebarBottom) {
							sidebar.scrollTop = linkBottom - sidebarHeight + 50;
						}
					}
				}
			});
		}

		// Track which heading is in view as user scrolls
		const observerOptions = {
			root: null,
			rootMargin: '-50% 0px -50% 0px',
			threshold: 0
		};

		const observer = new IntersectionObserver((entries) => {
			entries.forEach(entry => {
				// Only update from scroll observer if user is not actively clicking a link
				if (entry.isIntersecting && entry.target.id && !isUserClicking) {
					updateActiveTOC(entry.target.id);
				}
			});
		}, observerOptions);

		headings.forEach(heading => {
			if (heading.id) {
				observer.observe(heading);
			}
		});
	</script>
</body>
</html>
